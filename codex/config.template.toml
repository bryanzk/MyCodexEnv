model = "gpt-6.2-sol"
model_context_window = 1000000
model_auto_compact_token_limit = 900000
model_reasoning_effort = "low"
personality = "pragmatic"

[mcp_servers.sequential-thinking]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-sequential-thinking"]

[mcp_servers."chrome-devtools"]
command = "${NPM_GLOBAL_BIN}/chrome-devtools-mcp"
args = ["--no-usage-statistics", "--no-performance-crux"]

[features]
collaboration_modes = true
hooks = true

[plugins."goalbuddy@goalbuddy"]
enabled = true

[plugins."browser-use@openai-bundled"]
enabled = true

[[skills.config]]
path = "${CODEX_HOME}/plugins/cache/superpowers-dev/superpowers/6.2.0/skills/using-superpowers/SKILL.md"
enabled = false

[[skills.config]]
path = "${CODEX_HOME}/plugins/cache/superpowers-dev/superpowers/6.2.0/skills/brainstorming/SKILL.md"
enabled = false

# DHF lifecycle hooks. This template is the single source of the registration;
# ~/.codex/hooks.json belongs to other tools and is not written by sync.

[[hooks.SessionStart]]
matcher = "startup"
[[hooks.SessionStart.hooks]]
type = "command"
command = "/usr/bin/python3 ~/.codex/hooks/session_start_require_naming.py"
statusMessage = "Loading session naming rule"
[[hooks.SessionStart.hooks]]
type = "command"
command = "/usr/bin/python3 ~/.codex/hooks/session_bearing.py"
statusMessage = "Recovering session bearing"

# Second SessionStart group, after the first so the [hooks.state] indexes of the
# existing hooks do not move. It records every session start for the compaction
# ordinal, whatever the source.
[[hooks.SessionStart]]
matcher = "*"
[[hooks.SessionStart.hooks]]
type = "command"
command = "/usr/bin/python3 ~/.codex/hooks/compaction_recorder.py"
statusMessage = "Recording session start for compaction ordinal"

[[hooks.UserPromptSubmit]]
matcher = "*"
[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "/usr/bin/python3 ~/.codex/hooks/compaction_probe.py"
statusMessage = "Reading host-observed compaction ordinal"
[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "/usr/bin/python3 ~/.codex/hooks/dhf_preprompt.py"
statusMessage = "Applying DHF prompt policy"

[[hooks.PostCompact]]
matcher = "*"
[[hooks.PostCompact.hooks]]
type = "command"
command = "/usr/bin/python3 ~/.codex/hooks/compaction_recorder.py"
statusMessage = "Recording host compaction"

[[hooks.PreToolUse]]
matcher = "*"
[[hooks.PreToolUse.hooks]]
type = "command"
command = "/usr/bin/python3 ~/.codex/hooks/harness_guard.py"
statusMessage = "Checking harness tool policy"

[[hooks.PostToolUse]]
matcher = "*"
[[hooks.PostToolUse.hooks]]
type = "command"
command = "/usr/bin/python3 ~/.codex/hooks/harness_observer.py"
statusMessage = "Recording harness evidence"
