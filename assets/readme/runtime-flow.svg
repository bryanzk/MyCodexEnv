<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">MyCodexEnv runtime flow</title>
  <desc id="desc">Repository sources move through bootstrap and sync into local Codex and Claude runtimes, then pass fresh verification gates.</desc>

  <rect width="1200" height="420" rx="28" fill="#f4f1ea"/>
  <rect x="1" y="1" width="1198" height="418" rx="27" fill="none" stroke="#c9c4b9" stroke-width="2"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="52" y="58" fill="#59616b" font-size="18" letter-spacing="2">THE RUNTIME LOOP</text>
    <text x="1002" y="58" fill="#59616b" font-size="18">SOURCE → PROOF</text>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
    <g transform="translate(50 98)">
      <rect width="242" height="250" rx="18" fill="#ffffff" stroke="#c9c4b9" stroke-width="2"/>
      <text x="24" y="44" fill="#7a828c" font-size="20" font-weight="700">01</text>
      <text x="24" y="88" fill="#111820" font-size="30" font-weight="750">Source</text>
      <text x="24" y="126" fill="#59616b" font-size="20">codex/ · claude/</text>
      <text x="24" y="157" fill="#59616b" font-size="20">docs/ · scripts/</text>
      <path d="M24 196 H96 M24 216 H154" stroke="#48bfae" stroke-width="5" stroke-linecap="round"/>
    </g>

    <g transform="translate(336 98)">
      <rect width="242" height="250" rx="18" fill="#111820"/>
      <text x="24" y="44" fill="#7f8b99" font-size="20" font-weight="700">02</text>
      <text x="24" y="88" fill="#f4f1ea" font-size="30" font-weight="750">Build &amp; sync</text>
      <text x="24" y="126" fill="#c5ced8" font-size="20">bootstrap.sh</text>
      <text x="24" y="157" fill="#c5ced8" font-size="20">targeted sync</text>
      <rect x="24" y="198" width="194" height="34" rx="8" fill="#1c2631"/>
      <text x="38" y="221" fill="#48d7c5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">$ apply expected state</text>
    </g>

    <g transform="translate(622 98)">
      <rect width="242" height="250" rx="18" fill="#ffffff" stroke="#c9c4b9" stroke-width="2"/>
      <text x="24" y="44" fill="#7a828c" font-size="20" font-weight="700">03</text>
      <text x="24" y="88" fill="#111820" font-size="30" font-weight="750">Runtime</text>
      <rect x="24" y="112" width="194" height="48" rx="10" fill="#e6f8f5"/>
      <text x="40" y="143" fill="#13796c" font-size="20" font-weight="700">~/.codex</text>
      <rect x="24" y="172" width="194" height="48" rx="10" fill="#efe8ff"/>
      <text x="40" y="203" fill="#6543a7" font-size="20" font-weight="700">~/.claude</text>
    </g>

    <g transform="translate(908 98)">
      <rect width="242" height="250" rx="18" fill="#11251a"/>
      <text x="24" y="44" fill="#6f9d7b" font-size="20" font-weight="700">04</text>
      <text x="24" y="88" fill="#f4f1ea" font-size="30" font-weight="750">Evidence</text>
      <text x="24" y="128" fill="#b6d8bf" font-size="20">tests · loader</text>
      <text x="24" y="159" fill="#b6d8bf" font-size="20">parity · verifier</text>
      <circle cx="42" cy="207" r="15" fill="#52d273"/>
      <path d="M34 207 L40 213 L51 200" fill="none" stroke="#11251a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="70" y="215" fill="#8be7a1" font-size="24" font-weight="750">PASS</text>
    </g>
  </g>

  <g fill="none" stroke="#8d938f" stroke-width="3">
    <path d="M300 223 H326"/>
    <path d="M586 223 H612"/>
    <path d="M872 223 H898"/>
  </g>
  <g fill="#8d938f">
    <path d="M326 223 L316 216 V230 Z"/>
    <path d="M612 223 L602 216 V230 Z"/>
    <path d="M898 223 L888 216 V230 Z"/>
  </g>
</svg>
