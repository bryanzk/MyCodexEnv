name: CI

# Runs the repo's portable green gate on every push to main and every pull
# request. This is the automated consumer of the reproducible-green work: the
# suite is designed to pass with explicit SKIPs on machines without the codex
# CLI (CI included), so a red here is a real regression, not an environment gap.
# The codex-CLI-dependent runtime sync check (verify_codex_env.sh) is covered by
# skip-aware tests inside test_runner.py and is intentionally not run here.
#
# Environment prerequisites the suite relies on (both satisfied on
# ubuntu-latest): `rsync` on PATH and `CI=true` (set by Actions), which the
# isolated DHF runtime reset requires before it will touch $HOME.
#
# Lanes: a change set that only touches documentation (docs/**, tasks/**, or a
# top-level README/AGENTS/CONTEXT markdown file) runs `test_runner.py --lane
# docs`, which selects the registered tests that can observe those files by
# reverse-reference lookup; everything else runs the whole suite. A scheduled
# serial full run on main is the safety net for the docs lane.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * *"   # daily 06:00 UTC: full suite on main regardless of lane
  workflow_dispatch:

permissions:
  contents: read

# Superseded pull-request runs are cancelled; runs on main are never cancelled
# so every main commit keeps its own gate record.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # DHF simplification tests read an immutable historical baseline.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Pinned so a red gate means a repository regression, not an
          # interpreter change riding in with a runner image update.
          python-version: "3.12"

      # Dependency-free checks first: a formatting or surface error is visible
      # in seconds instead of after the full suite.
      - name: Check formatting (whitespace/conflict markers)
        run: git diff --check

      - name: Validate runtime surfaces manifest and public nav
        run: python3 scripts/check_surfaces.py --repo-root "$(pwd)" --check-public-nav

      - name: Decide test lane
        id: lane
        env:
          # PR: compare with the target branch; push to main: with the previous
          # main head; force-push / first push (all-zero before) falls back to
          # HEAD~1. Scheduled and manual runs always take the full lane.
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before || 'HEAD~1') }}
        run: |
          lane=full
          changed=""
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "pull_request" ]; then
            changed=$(git diff --name-only --diff-filter=ACDMRT "$BASE...HEAD" | sort -u)
            if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -qvE '^(docs/|tasks/|README\.md$|README\.zh-CN\.md$|AGENTS\.md$|CONTEXT\.md$)'; then
              lane=docs
            fi
          fi
          printf 'changed files:\n%s\n' "$changed"
          echo "lane=$lane"
          echo "lane=$lane" >> "$GITHUB_OUTPUT"
          {
            echo "changed<<EOF"
            printf '%s\n' "$changed"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Seed exact DHF runtime promotion
        env:
          CI_DHF_HOME: /tmp/ci-dhf-home
        run: |
          mkdir -p \
            "$CI_DHF_HOME/.codex/hooks" \
            "$CI_DHF_HOME/.codex/skills/delivery-harness-framework"
          cp "codex/hooks/dhf_preprompt.py" \
            "$CI_DHF_HOME/.codex/hooks/dhf_preprompt.py"
          cp -R "codex/skills/delivery-harness-framework/." \
            "$CI_DHF_HOME/.codex/skills/delivery-harness-framework/"

      - name: Run test suite (per-test isolation; codex/git-dependent checks SKIP)
        if: steps.lane.outputs.lane == 'full'
        env:
          HOME: /tmp/ci-dhf-home
          CI_DHF_RUNTIME_RESET: "1"
        run: python3 test_runner.py

      - name: Run docs lane (tests that observe the changed documentation)
        if: steps.lane.outputs.lane == 'docs'
        env:
          HOME: /tmp/ci-dhf-home
          CI_DHF_RUNTIME_RESET: "1"
          CHANGED: ${{ steps.lane.outputs.changed }}
        run: printf '%s\n' "$CHANGED" | xargs -d '\n' python3 test_runner.py --lane docs --changed
