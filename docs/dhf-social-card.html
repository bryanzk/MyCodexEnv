<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200,initial-scale=1">
  <title>DHF Social Card</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:1200px;height:630px;overflow:hidden}body{display:grid;place-items:center;padding:58px;background:#f7f4ec;color:#231f1a;font-family:Arial,sans-serif;background-image:linear-gradient(115deg,transparent 48%,rgba(35,31,26,.08) 49%,transparent 50%);background-size:76px 76px}.card{width:100%;height:100%;display:grid;grid-template-columns:1fr 270px;gap:42px;align-items:end;padding:58px;border:1px solid rgba(35,31,26,.18);border-radius:32px;background:rgba(255,253,248,.92);box-shadow:0 22px 60px rgba(51,42,33,.12)}.eyebrow,.domain{color:#147a62;font:700 17px/1.2 ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase}h1{max-width:760px;margin:24px 0 22px;font:700 76px/.96 Georgia,serif;letter-spacing:-.045em}.lead{max-width:760px;margin:0;color:#665f55;font-size:25px;line-height:1.4}.route{align-self:stretch;display:grid;align-content:space-between;padding:30px;border-radius:24px;background:#132b24;color:#f6eee3}.route strong{font:700 27px Georgia,serif}.route span{color:#7ce2ca;font:700 17px/1.6 ui-monospace,monospace}.domain{align-self:end;color:#7ce2ca}
  </style>
</head>
<body data-dhf-status="2026-08-22">

    <section><div class="eyebrow">Delivery Harness Framework</div><h1>From ambiguous requests to verifiable delivery.</h1><p class="lead">Governed context, explicit authority, recoverable execution, and checkable evidence for agentic engineering.</p></section>
