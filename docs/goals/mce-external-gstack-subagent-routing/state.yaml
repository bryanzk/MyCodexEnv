version: 2

goal:
  title: "MCE External gstack and Subagent Routing"
  slug: "mce-external-gstack-subagent-routing"
  kind: existing_plan
  tranche: "Validate and execute WP1 external gstack authority, freeze its baseline, execute WP2 role routing and targeted promotion, then prove behavior and complete a final audit."
  status: done
  intake:
    original_request: "Enable Goal mode and execute the approved MCE External gstack authority plus Subagent routing plan."
    interpreted_outcome: "The current Codex runtime uses a verified external gstack authority and deterministic role-routing contracts, with recoverable runtime transactions and fresh source/parity/activity/behavior evidence."
    input_shape: existing_plan
    audience: "MyCodexEnv owner and future maintainers"
    authority: approved
    proof_type: test
    completion_proof: "WP1/WP2 gates pass, runtime transactions are independently approved and verified, behavior observations are complete, and final Judge records full_outcome_complete: true."
    likely_misfire: "Stopping after board creation, planning, source changes, or parity; broad-syncing gstack; treating loader evidence as behavior; or expanding scope to unrelated cleanup."
    blind_spots_considered:
      - "External gstack and runtime topology are time-sensitive and must be re-read before mutation."
      - "Shared runtime writes require one lock, quiescence, journaled recovery, and exact manifests."
      - "The plan was revised after the ninth committee blind review and was not rescored afterward."
      - "GoalBuddy Scout/Worker/Judge configs are bundled but not installed; PM fallback is allowed."
      - "Behavior observation requires user-created tasks and cannot be inferred from source or parity."
    existing_plan_facts:
      - "WP1 precedes WP2 and freezes the baseline used to measure WP2 delta."
      - "WP1 has 11 functional/doc files plus the 3 shared Identity files required by the fresh C-layer evidence; the owner-approved cumulative unique allowlist is 17 files."
      - "WP1 runtime is 53 flat gstack targets plus one 13-link sidecar, journal/staging/backup, and the existing .phase0-sync.lock."
      - "WP2 runtime promotion has exactly three regular-file targets and separate backup/staging paths."
      - "No commit, push, issue, task, thread, broad sync, setup, reset, or vendor sync is authorized."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true

agents:
  scout: bundled_not_installed
  worker: bundled_not_installed
  judge: bundled_not_installed

